<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef;
  --text:#132f57; --muted:#5b6b80; --cyan:#42e8ff; --cyan-d:#1fb8cc; --navy:#132f57;
  --shadow:0 10px 28px -18px rgba(19,47,87,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:32px 24px 24px;text-align:center;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--cyan),var(--cyan-d))}
.logo{display:block;height:24px;width:auto;margin:0 auto 24px}
.photo{width:112px;height:112px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;
  border:3px solid #fff;box-shadow:0 0 0 2px var(--cyan),0 10px 24px -12px rgba(19,47,87,.5)}
h1{font-family:Poppins,Inter,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.role{color:var(--muted);font-size:15px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:10px;
  font-weight:600;font-size:16px;text-decoration:none;color:var(--navy);transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.book{margin-top:26px;background:var(--cyan);font-family:Poppins,Inter,sans-serif;font-size:17px;
  box-shadow:0 10px 26px -12px rgba(31,184,204,.9)}
.book:hover{box-shadow:0 12px 30px -10px rgba(31,184,204,1)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sec{background:var(--bg);border:1px solid var(--line)}
.sec:hover{border-color:var(--cyan-d)}
.links{display:grid;gap:10px;margin-top:10px}
.foot{margin-top:20px;font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
</style>
</head>
<body>

</main>
</body>
</html>
